<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أونو كرة القدم - Uno Foot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشاشة الأولى: إدخال الاسم وإنشاء/انضمام للغرفة -->
    <div id="auth-screen" class="card-container">
        <h1>⚽ أونو كرة القدم</h1>
        <p class="subtitle">لعبة البطاقات التكتيكية بين الأصدقاء</p>

        <input type="text" id="player-name" placeholder="أدخل اسمك هنا..." maxlength="15">
        
        <button class="btn btn-primary" onclick="createNewGame()">إنشاء غرفة جديدة 🎲</button>
        
        <div class="divider">أو انضم برقم الغرفة</div>
        
        <input type="text" id="room-code-input" placeholder="أدخل رقم الغرفة (مثال: 4582)" maxlength="6">
        <button class="btn btn-secondary" onclick="joinGameByCode()">انضمام للغرفة 🔗</button>
    </div>

    <!-- الشاشة الثانية: انتظار اللاعبين نسخ الرقم -->
    <div id="lobby-screen" class="card-container hidden">
        <h2>غرفة الانتظار ⏳</h2>
        <p class="subtitle">أعطِ رقم الغرفة لأصدقائك لينضموا إليك</p>

        <div class="link-box">
            <input type="text" id="share-link-field" readonly style="direction: ltr; text-align: center;">
            <button class="btn btn-secondary" onclick="copyRoomLink()" style="width: auto;">نسخ 📋</button>
        </div>

        <div class="players-list-box">
            <h4>اللاعبون المتواجدون:</h4>
            <ul id="players-ul">
                <!-- سيتم إضافة أسماء اللاعبين هنا برمجياً -->
            </ul>
        </div>

        <button class="btn btn-primary" onclick="startGameSession()">بدء اللعب الآن 🚀</button>
    </div>

    <!-- الشاشة الثالثة: طاولـة اللعب الفعلي -->
    <div id="game-screen" class="game-board hidden">
        <div class="top-bar">
            <span class="room-badge">Uno Foot ⚽</span>
            <span id="current-turn-display" class="turn-badge">دور: جارٍ التحميل...</span>
        </div>

        <!-- منتصف الطاولة: الكرت الملعيوب ورصيد السحب -->
        <div class="table-center">
            <div>
                <span class="slot-label">سحب بطاقة</span>
                <div class="card var-card" onclick="playerDrawsCard()" style="cursor: pointer; justify-content: center; align-items: center;">
                    <span style="font-size: 2rem;">🎴</span>
                    <span style="font-size: 0.75rem; font-weight: bold; margin-top: 5px;">سحب</span>
                </div>
            </div>

            <div>
                <span class="slot-label">الكرت الحالي</span>
                <div id="active-card" class="card club">
                    <div class="card-top" id="active-card-type">نادي</div>
                    <div>
                        <div class="card-icon" id="active-card-img">🔴🔵</div>
                        <div class="card-title" id="active-card-name">برشلونة</div>
                    </div>
                    <div class="card-bottom">⚽</div>
                </div>
            </div>
        </div>

        <!-- أوراق اللاعب الحالية -->
        <div class="player-hand-section">
            <h4>أوراقك الحالية (اضغط على الكرت للعب):</h4>
            <div id="my-hand-container" class="hand-scroll">
                <!-- يتم توليد أوراق اليد هنا عبر JavaScript -->
            </div>
        </div>

        <div class="controls-area">
            <button class="btn btn-draw" onclick="playerDrawsCard()">سحب كرت جديد ➕</button>
        </div>
    </div>

    <!-- استدعاء مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- ملف اللعبة البرمجي -->
    <script src="app.js"></script>
</body>
</html>
